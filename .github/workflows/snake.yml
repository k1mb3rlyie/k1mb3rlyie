name: Generate pink snake

on:
  schedule:
    - cron: "0 */12 * * *"   
  workflow_dispatch:          
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: k1mb3rlyie
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%23FF1493&color_dots=%23FFE3F1,%23FFB3D9,%23FF8FC7,%23FF4FA3,%23FF1493
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_dots=%23231320,%235C1F3D,%23A3245F,%23FF4FA3,%23FF8FC7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
